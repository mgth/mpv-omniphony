name: build-master

# Track upstream mpv master HEAD (no pin on the upstream side). The daily smoke
# test merges the fork's master tag into mpv's moving master and builds the
# result: when it fails, rebase orender-master in the fork, tag it and update
# mpv-fork.env (README, "Tracking mpv master").

on:
  push:
    paths:
      - 'mpv-fork.env'
      - 'scripts/mpv-source.sh'
      - 'scripts/fork-lib.sh'
      - '.github/workflows/build-master.yml'
  pull_request:
    paths:
      - 'mpv-fork.env'
      - 'scripts/mpv-source.sh'
      - 'scripts/fork-lib.sh'
      - '.github/workflows/build-master.yml'
  schedule:
    - cron: '0 6 * * *'   # daily: master moves fast, weekly is too slow
  workflow_dispatch:

jobs:
  build-mpv-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config gcc \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev \
            libass-dev liblua5.2-dev libx11-dev python3-jinja2

      # No liborender needed at build time: the patched mpv dlopens it at
      # runtime against its vendored ABI header (common/orender_abi.h).
      - name: mpv source (mpv master HEAD + the fork's master tag)
        id: snap
        run: |
          # On its own line: a failure (mpv master has moved under the fork's
          # commits) must fail this step, not the next one.
          src="$(bash scripts/mpv-source.sh master)"
          echo "src=$src" >> "$GITHUB_OUTPUT"

      # mpv master requires libplacebo >= 7.x while ubuntu-latest apt ships 6.x.
      # Upstream's documented answer is the meson subproject fallback (mpv's
      # dependency() even sets default_library=static + demos=false for it), so
      # track libplacebo master the same way this workflow tracks mpv master.
      # python3-jinja2 above is needed by libplacebo's glad code generator.
      - name: Provide libplacebo as a meson subproject
        run: |
          mkdir -p "${{ steps.snap.outputs.src }}/subprojects"
          git clone --depth 1 --recurse-submodules \
            https://code.videolan.org/videolan/libplacebo \
            "${{ steps.snap.outputs.src }}/subprojects/libplacebo"

      - name: Configure & build
        run: |
          cd "${{ steps.snap.outputs.src }}"
          meson setup _b -Dorender=enabled
          meson compile -C _b

      - name: Smoke test
        run: |
          cd "${{ steps.snap.outputs.src }}"
          ./_b/mpv --version
