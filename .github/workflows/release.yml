name: Release

# Triggered by a v* tag.
# Builds mpv (with our ad_orender patches) for Linux, Windows (MinGW cross) and
# macOS arm64 (native), bundles each with the matching liborender artifacts, and
# creates a draft GitHub release.
#
# The decoder bridge is NOT bundled — it carries licensing constraints that
# require the user to download it separately (see README).
on:
  push:
    tags:
      - 'v*'
      # FEL beta tags (e.g. v0.4.0-fel-beta.1) are built + published by
      # build-fel.yml on the master track; keep them off the stable release.
      - '!*-fel*'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version label used in the asset filenames (e.g. v0.5.0). Defaults to
          the ref name. Set it when rebuilding an asset for an already-published
          release.
        required: false
        default: ''
      windows_only:
        description: >-
          Skip the Linux and macOS builds. Used to produce a Windows-only asset
          (e.g. the libmpv SDK) for a release that already shipped.
        type: boolean
        default: false

env:
  MPV_TAG: v0.41.0
  # Omniphony tag liborender is built from, in lockstep with the renderer.
  # We build liborender FROM SOURCE here rather than downloading a pinned
  # prebuilt release: that keeps orender.dll/.so and orender.h coherent by
  # construction, and removes the stale-prebuilt skew that made mpv silently
  # ship an old liborender (config parsed differently → default room). Bump
  # this one line on each release.
  OMNIPHONY_REF: v0.5.2
  # Version label baked into the asset filenames: the tag on a tag push, the
  # `version` input on a manual run. The zip steps flatten any '/' — a branch
  # ref name would otherwise make `zip` write into a directory that isn't there.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build-linux:
    # `windows_only` manual runs rebuild a Windows asset for a release that
    # already shipped; the other platforms would just burn CI time.
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mpv build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config gcc \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev \
            libass-dev libplacebo-dev liblua5.2-dev \
            libva-dev libdrm-dev libegl-dev libgl-dev \
            libbluray-dev libdvdnav-dev libdvdread-dev \
            libx11-dev libxss-dev libxext-dev libxpresent-dev libxrandr-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev libpipewire-0.3-dev libpulse-dev
          # x11: libx11-dev alone is NOT enough — mpv's meson x11 feature also
          # requires xscrnsaver/xext/xpresent/xrandr, and silently disables the
          # whole X11 vo when any of them is missing (issue #59: the v0.4.2
          # Linux asset shipped with no windowed vo and no audio ao at all).
          # wayland: client lib + protocols + xkbcommon for vo_gpu on Wayland.
          # audio: ALSA + PipeWire + PulseAudio aos.

      - name: Checkout Omniphony (renderer source)
        uses: actions/checkout@v5
        with:
          repository: mgth/Omniphony
          ref: ${{ env.OMNIPHONY_REF }}
          path: omniphony

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build liborender from source
        # orender_ffi only pulls orender_engine (audio-free) — no PipeWire/Tauri
        # toolchains needed, same as Omniphony's own liborender-release workflow.
        run: cargo build --release -p orender_ffi
        working-directory: omniphony/omniphony-renderer
        env:
          # This builds a *pinned external* source tree (Omniphony at
          # OMNIPHONY_REF), so lint policy there is not ours to enforce: an
          # immutable tag must stay buildable as rustc grows new lints.
          # dead_code in particular fires on liborender's dormant
          # artifact-evaluator path, which is reachable only through code the
          # FFI build never links.
          RUSTFLAGS: -D warnings -A dead_code

      - name: Stage liborender (bundled fallback)
        # mpv no longer links liborender — it dlopens it at runtime, preferring
        # a Studio-deployed engine and falling back to this bundled copy found
        # next to the executable. Name the file after its own soname
        # (liborender.so.<ABI major>, stamped by orender_ffi/build.rs) so the
        # loader's exe-dir candidate matches without hardcoding the major here.
        run: |
          mkdir -p staging
          rel=omniphony/omniphony-renderer/target/release
          soname=$(objdump -p "$rel/liborender.so" | awk '/SONAME/ {print $2}')
          cp "$rel/liborender.so" "staging/${soname:?no SONAME in liborender.so}"
          cp omniphony/omniphony-renderer/orender_ffi/include/orender.h staging/

      - name: Install nv-codec-headers (CUDA hwaccel)
        run: |
          # mpv's cuda-hwaccel/cuda-interop only need the ffnvcodec headers at
          # build time; libcuda/libnvcuvid are dlopen'd at runtime on the user's
          # machine, so no CUDA SDK is required here. Install into the same
          # sysroot that is already on PKG_CONFIG_PATH for the mpv build below.
          git clone --depth 1 --branch n13.0.19.0 \
            https://github.com/FFmpeg/nv-codec-headers nv-codec-headers
          make -C nv-codec-headers install PREFIX="${{ github.workspace }}/sysroot/usr"

      - name: Apply patches onto mpv
        run: bash scripts/apply-patches.sh "$MPV_TAG"

      - name: Build mpv with ad_orender
        run: |
          # sysroot pkgconfig only carries ffnvcodec now; liborender is a pure
          # runtime dependency (dlopen) and needs nothing at build time.
          export PKG_CONFIG_PATH="${{ github.workspace }}/sysroot/usr/lib/pkgconfig"
          cd "build/mpv-${MPV_TAG}"
          # cuda-hwaccel/-interop: NVIDIA hardware decoding (ffnvcodec above).
          # vaapi: AMD/Intel hardware decoding (VA-API) — apt's ffmpeg already
          # carries vaapi, so libva-dev/libdrm-dev above is all mpv needs.
          # (No -Dvulkan hwdec here: it needs ffmpeg >= 7.0 and apt ships 6.x.)
          # libbluray/dvdnav: BD/DVD/ISO playback. Forced on (not auto) so the
          # build FAILS LOUDLY if the dep is missing rather than silently
          # shipping a release without disc support. (dvdnav pulls libdvdread;
          # there is no separate mpv 'dvdread' option.)
          # x11/wayland/alsa/pipewire/pulse: desktop output backends, forced on
          # for the same reason — meson's auto features silently drop them when
          # a dev package is missing, which shipped a v0.4.2 Linux binary that
          # could only render to files (issue #59).
          meson setup _b -Dorender=enabled \
            -Dcuda-hwaccel=enabled -Dcuda-interop=enabled \
            -Dvaapi=auto \
            -Dx11=enabled -Dwayland=enabled \
            -Dalsa=enabled -Dpipewire=enabled -Dpulse=enabled \
            -Dlibbluray=enabled -Ddvdnav=enabled
          meson compile -C _b

      - name: Package (zip)
        run: |
          cp "build/mpv-${MPV_TAG}/_b/mpv" staging/
          cp README.md staging/
          cd staging
          zip -r "../mpv-omniphony-${VERSION//\//-}-linux-x86_64.zip" .

      - uses: actions/upload-artifact@v6
        with:
          name: mpv-omniphony-linux-x86_64
          path: mpv-omniphony-*-linux-x86_64.zip

  # Build orender.dll from the same Omniphony ref, natively on Windows (MSVC,
  # C ABI) exactly like Omniphony's own liborender-release workflow. The mpv
  # Windows job consumes this artifact instead of a pinned prebuilt release.
  build-liborender-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Omniphony (renderer source)
        uses: actions/checkout@v5
        with:
          repository: mgth/Omniphony
          ref: ${{ env.OMNIPHONY_REF }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build orender_ffi (release)
        run: cargo build --release -p orender_ffi
        working-directory: omniphony-renderer
        env:
          # This builds a *pinned external* source tree (Omniphony at
          # OMNIPHONY_REF), so lint policy there is not ours to enforce: an
          # immutable tag must stay buildable as rustc grows new lints.
          # dead_code in particular fires on liborender's dormant
          # artifact-evaluator path, which is reachable only through code the
          # FFI build never links.
          RUSTFLAGS: -D warnings -A dead_code

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item omniphony-renderer/target/release/orender.dll out/
          Copy-Item omniphony-renderer/orender_ffi/include/orender.h out/

      - uses: actions/upload-artifact@v6
        with:
          name: liborender-windows-from-source
          path: out

  build-windows:
    needs: build-liborender-windows
    runs-on: ubuntu-latest
    # Arch base + Martchus's mingw-w64 binary repo gives us pre-built MinGW
    # builds of ffmpeg, libplacebo, libass, lua — the libs mpv needs that
    # apt's mingw-w64-* packages don't carry.
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap Arch + Martchus mingw-w64 repo
        run: |
          pacman-key --init
          # Allow unsigned downloads from the Martchus binary repo (it ships
          # its own signing infra; for CI we trust-on-first-use rather than
          # importing keys every run).
          cat >> /etc/pacman.conf <<'EOF'

          [ownstuff]
          SigLevel = Optional TrustAll
          Server = https://martchus.no-ip.biz/repo/arch/$repo/os/$arch
          EOF
          pacman -Syu --noconfirm

      - name: Install MinGW toolchain + mpv deps
        run: |
          pacman -S --noconfirm --needed \
            base-devel git unzip zip curl \
            mingw-w64-gcc \
            mingw-w64-pkg-config \
            mingw-w64-meson \
            mingw-w64-ffmpeg \
            mingw-w64-libplacebo \
            mingw-w64-libass \
            mingw-w64-spirv-cross \
            mingw-w64-libdvdnav mingw-w64-libdvdread
          # ^ DVD playback (folders + ISO), from the Martchus 'ownstuff' repo
          # configured above (libdvdnav 6.1.1 -> libdvdread 6.1.3; they read disc
          # images natively). libbluray is deliberately NOT taken from Martchus:
          # its prebuilt is compiled without libudfread (BD folders only), so we
          # build it from source with the embedded udfread in a later step for
          # BD-ISO support. The recursive DLL walker in packaging bundles them.

      - name: Build & install libsrt from source (ABI-matched to our libstdc++)
        run: |
          # Both the Martchus and the MSYS2 prebuilt libsrt.dll import C++ stdlib
          # symbols their respective libstdc++ exports but the other doesn't.
          # Since the rest of the bundle (mpv.exe, libavcodec, libplacebo, …) is
          # compiled by Martchus's mingw-w64-gcc 16.1, the only fix that doesn't
          # break some other lib is to rebuild libsrt against the exact same
          # libstdc++ we ship. libsrt is small and its CMake build is turnkey.
          SYS=/usr/x86_64-w64-mingw32
          pacman -S --noconfirm --needed \
            mingw-w64-cmake mingw-w64-openssl
          SRT_VER=1.5.5
          curl -sLO "https://github.com/Haivision/srt/archive/refs/tags/v${SRT_VER}.tar.gz"
          tar xzf "v${SRT_VER}.tar.gz"
          cd "srt-${SRT_VER}"
          mkdir build && cd build
          x86_64-w64-mingw32-cmake .. \
            -DENABLE_APPS=OFF \
            -DENABLE_BONDING=OFF \
            -DENABLE_STATIC=OFF \
            -DENABLE_SHARED=ON \
            -DCMAKE_INSTALL_PREFIX="$SYS"
          cmake --build . -j"$(nproc)"
          cmake --install .
          # CMake on MinGW installs the shared lib as srt.dll (no `lib` prefix
          # for OUTPUT_NAME=srt). avformat looks for libsrt.dll — keep both
          # names so the linker and the runtime both find it.
          if [ -f "$SYS/bin/srt.dll" ] && [ ! -f "$SYS/bin/libsrt.dll" ]; then
            cp "$SYS/bin/srt.dll" "$SYS/bin/libsrt.dll"
          fi
          echo "libsrt rebuilt:"
          ls -la "$SYS/bin/"*srt*.dll "$SYS/lib/"*srt* 2>/dev/null
          # Sanity check: must not require the symbol that broke us last time.
          missing=$(x86_64-w64-mingw32-objdump -p "$SYS/bin/libsrt.dll" \
            | grep -cE "_ZNSi5seekgESt4fposIiE|_ZSt21ios_base_library_initv" || true)
          # (0 = neither imported = good. >0 means an unexpected import slipped
          # back; would crash on Windows the same way as before.)
          test "$missing" -eq 0 || { echo "FAIL: libsrt still imports forbidden libstdc++ symbol(s)" >&2; exit 1; }

      - name: Build & install Lua 5.2 (MinGW)
        run: |
          # mpv 0.41 accepts lua52|lua51|luajit only — not lua54.
          # Martchus only ships mingw-w64-lua51, so build Lua 5.2 ourselves
          # (tiny, self-contained, turnkey `mingw` Makefile target).
          SYS=/usr/x86_64-w64-mingw32
          LUA_VER=5.2.4
          curl -sLO "https://www.lua.org/ftp/lua-${LUA_VER}.tar.gz"
          tar xzf "lua-${LUA_VER}.tar.gz"
          cd "lua-${LUA_VER}"
          # mingw target builds lua52.dll + tools
          make PLAT=mingw \
            CC=x86_64-w64-mingw32-gcc \
            AR="x86_64-w64-mingw32-ar rcu" \
            RANLIB=x86_64-w64-mingw32-ranlib \
            mingw
          install -Dm755 src/lua52.dll       "$SYS/bin/lua52.dll"
          # MinGW's `-llua52` searches for liblua52.{dll.a,a}. Lua's mingw
          # target produces a generic `liblua.a` — rename it on install so
          # the linker finds it.
          install -Dm644 src/liblua.a        "$SYS/lib/liblua52.a"
          install -Dm644 src/lua.h           "$SYS/include/lua.h"
          install -Dm644 src/lualib.h        "$SYS/include/lualib.h"
          install -Dm644 src/lauxlib.h       "$SYS/include/lauxlib.h"
          install -Dm644 src/luaconf.h       "$SYS/include/luaconf.h"
          install -d "$SYS/lib/pkgconfig"
          cat > "$SYS/lib/pkgconfig/lua52.pc" <<EOF
          prefix=$SYS
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: Lua
          Description: Lua 5.2 (MinGW cross build)
          Version: ${LUA_VER}
          Libs: -L\${libdir} -llua52
          Cflags: -I\${includedir}
          EOF
          x86_64-w64-mingw32-pkg-config --modversion lua52

      - name: Build & install nv-codec-headers (CUDA hwaccel, MinGW)
        run: |
          # Header-only ffnvcodec install so mpv's cuda-hwaccel can configure for
          # the MinGW target; nvcuda/nvcuvid are loaded at runtime on the user's
          # NVIDIA machine, so nothing else is needed at cross-compile time.
          # Installs ffnvcodec.pc into $SYS/lib/pkgconfig, where the MinGW
          # pkg-config wrapper looks (same place lua52.pc lands).
          SYS=/usr/x86_64-w64-mingw32
          git clone --depth 1 --branch n13.0.19.0 \
            https://github.com/FFmpeg/nv-codec-headers nv-codec-headers
          make -C nv-codec-headers install PREFIX="$SYS"
          x86_64-w64-mingw32-pkg-config --modversion ffnvcodec

      - name: Download liborender (built from source)
        uses: actions/download-artifact@v7
        with:
          name: liborender-windows-from-source
          path: /tmp/liborender

      # liborender is a pure runtime dependency now (mpv dlopens it against its
      # vendored ABI header) — nothing to install into the MinGW sysroot; the
      # downloaded orender.dll goes straight into the zip next to mpv.exe,
      # where the runtime loader's exe-dir candidate finds it.
      - name: Apply patches onto mpv
        run: bash scripts/apply-patches.sh "$MPV_TAG"

      - name: Write meson cross-file (x86_64-w64-mingw32)
        run: |
          mkdir -p sysroot
          cat > sysroot/mingw-cross.ini <<'EOF'
          [binaries]
          c = 'x86_64-w64-mingw32-gcc'
          cpp = 'x86_64-w64-mingw32-g++'
          ar = 'x86_64-w64-mingw32-ar'
          strip = 'x86_64-w64-mingw32-strip'
          pkg-config = 'x86_64-w64-mingw32-pkg-config'
          windres = 'x86_64-w64-mingw32-windres'

          [host_machine]
          system = 'windows'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

      - name: Build & install libbluray with BD-ISO (libudfread) support
        run: |
          # Martchus ships libbluray without libudfread (BD folders only). Build
          # it from source with the vendored udfread embedded so raw BD ISOs
          # open; installs over the MinGW sysroot the mpv build below links to.
          CROSS_FILE="$GITHUB_WORKSPACE/sysroot/mingw-cross.ini" \
            bash scripts/build-libbluray-mingw.sh

      # ao_asio needs the Steinberg ASIO SDK headers (GPLv3 half of its dual
      # licence). Exports ASIO_SDK_DIR, consumed by -Dasio-sdk below.
      - name: Setup ASIO SDK
        uses: ./.github/actions/setup-asio-sdk

      - name: Cross-compile mpv (MinGW)
        run: |
          # The cross-file uses x86_64-w64-mingw32-pkg-config (Martchus wrapper),
          # which sets its own PKG_CONFIG_LIBDIR to /usr/x86_64-w64-mingw32/lib/pkgconfig
          # (liborender needs nothing here: it is a pure runtime dependency).
          # $GITHUB_WORKSPACE is the workspace path inside the container.
          cd "build/mpv-${MPV_TAG}"
          # Lua 5.2 is built from source in a previous step and installed into
          # $SYS — mpv's `dependency('lua52')` finds it via pkg-config.
          # cuda-hwaccel forced on (ffnvcodec installed above) so the Windows
          # binary carries NVIDIA hardware decoding. cuda-interop is left at auto:
          # the MinGW GL/D3D interop path is less certain to configure here, and
          # decode (hwaccel) is what "CUDA support" requires — interop is only a
          # zero-copy display optimisation on top.
          meson setup _b \
            --cross-file="$GITHUB_WORKSPACE/sysroot/mingw-cross.ini" \
            -Dorender=enabled \
            -Dlua=lua52 \
            -Dasio=enabled -Dasio-sdk="$ASIO_SDK_DIR" \
            -Dd3d11=enabled \
            -Dcuda-hwaccel=enabled \
            -Dlibbluray=enabled -Ddvdnav=enabled
          meson compile -C _b

      - name: Package (zip)
        run: |
          SYS=/usr/x86_64-w64-mingw32
          mkdir -p staging
          cp "build/mpv-${MPV_TAG}/_b/mpv.exe" staging/
          # mpv.com is the console-subsystem wrapper that exposes stdout/stderr;
          # cmd.exe resolves `mpv` to mpv.com first (PATHEXT priority), so logs
          # show up when launched from a console. Without it, mpv.exe runs
          # detached from the console and prints nothing.
          cp "build/mpv-${MPV_TAG}/_b/mpv.com" staging/
          cp /tmp/liborender/orender.dll staging/
          cp /tmp/liborender/orender.h staging/
          cp README.md staging/
          # Recursively follow DLL deps so transitive runtime libs (libstdc++,
          # libwinpthread, ffmpeg, etc.) are bundled. Skip Windows system DLLs.
          # Use a worklist (not a pipeline) so the recursion's state survives —
          # the previous `awk | while` pipeline ran the while in a subshell, so
          # transitive deps weren't always re-scanned correctly.
          should_skip() {
            case "$1" in
              KERNEL32.*|USER32.*|GDI32.*|ADVAPI32.*|MSVCRT.*|SHELL32.*|ole32.*|OLEAUT32.*|WS2_32.*|IMM32.*|VERSION.*|WINMM.*|d3d*|dxgi*|opengl32.*|setupapi.*|RPCRT4.*|bcrypt.*|CRYPT32.*|comdlg32.*|netapi32.*|powrprof.*|psapi.*|userenv.*|wininet.*|wintrust.*|comctl32.*|iphlpapi.*|secur32.*|uxtheme.*|dwmapi.*|crypt32.*|ncrypt.*|dnsapi.*|mpr.*|mswsock.*|odbc32.*|odbccp32.*)
                return 0 ;;
            esac
            return 1
          }
          worklist=(staging/mpv.exe)
          while [ ${#worklist[@]} -gt 0 ]; do
            exe="${worklist[0]}"
            worklist=("${worklist[@]:1}")
            echo "scanning $exe"
            for dll in $(x86_64-w64-mingw32-objdump -p "$exe" 2>/dev/null \
                          | awk '/DLL Name:/ {print $3}'); do
              should_skip "$dll" && continue
              [ -f "staging/$dll" ] && continue
              if [ -f "$SYS/bin/$dll" ]; then
                cp "$SYS/bin/$dll" staging/
                worklist+=("staging/$dll")
                echo "  + $dll"
              else
                echo "  ! NOT FOUND: $dll"
              fi
            done
          done
          # Belt-and-suspenders: also force-copy the MinGW C/C++ runtime DLLs.
          # libsrt and other C++ libs link dynamically against libstdc++ and
          # libgcc_s; if Windows can't find them next to mpv.exe it may load a
          # stale version from the user's PATH (MSYS2, Git for Windows, …) and
          # fail on missing symbols (e.g. _ZSt21ios_base_library_initv).
          for dll in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
            if [ -f "$SYS/bin/$dll" ] && [ ! -f "staging/$dll" ]; then
              cp "$SYS/bin/$dll" staging/
              echo "  + $dll (forced)"
            fi
          done
          # Use bash for the worklist syntax above.
        shell: bash

      - name: Verify staged DLL imports resolve
        # Guard against prebuilt-repo skew: a library bumped in the binary repo
        # while its dependants were built against the previous version ships a
        # bundle that fails at launch on every Windows machine with an "entry
        # point not found" dialog (mgth/Omniphony#200: avcodec-62.dll importing
        # x265_api_get_215 next to a libx265.dll exporting x265_api_get_216).
        run: python3 scripts/check-bundle-imports.py staging

      - name: Package final zip
        run: |
          ls -la staging/
          cd staging
          zip -r "../mpv-omniphony-${VERSION//\//-}-windows-x86_64.zip" .

      - uses: actions/upload-artifact@v6
        with:
          name: mpv-omniphony-windows-x86_64
          path: mpv-omniphony-*-windows-x86_64.zip

      # Second Windows asset for embedders (mgth/mpv-omniphony#50): the same
      # build's libmpv, kept out of the player zip so a plain user download does
      # not grow by another ~15 MB of DLL + headers.
      - name: Stage libmpv SDK
        run: |
          B="build/mpv-${MPV_TAG}/_b"
          # mpv's `libmpv` meson option defaults to true, so the cplayer build
          # above already produced the shared library — fail loudly rather than
          # ship an empty SDK if a future mpv bump flips that default. The DLL
          # carries the client-API major (libmpv-2.dll today); glob it so an API
          # bump renames the file instead of breaking the job.
          dll=$(ls "$B"/libmpv-*.dll 2>/dev/null | head -1)
          implib=$(ls "$B"/libmpv*.dll.a 2>/dev/null | head -1)
          [ -n "$dll" ] && [ -n "$implib" ] \
            || { echo "!! libmpv not built"; ls "$B"; exit 1; }
          # Start from the player bundle so every transitive runtime DLL comes
          # along (mpv.exe is libmpv plus a main(), so its import closure is a
          # superset of libmpv's). Copying the directory rather than *.dll also
          # keeps PE files with Unix-style versioned names (libgsm.dll.1.0.23).
          cp -a staging staging-libmpv
          rm -f staging-libmpv/mpv.exe staging-libmpv/mpv.com
          cp "$dll" staging-libmpv/
          cp "$implib" staging-libmpv/   # MinGW/clang import library
          mkdir -p staging-libmpv/include/mpv
          cp "build/mpv-${MPV_TAG}/include/mpv/"*.h staging-libmpv/include/mpv/
          mv staging-libmpv/orender.h staging-libmpv/include/
          # MSVC can't link the MinGW import library; it builds its own from
          # this. Restrict it to the client API: the DLL also exports the Lua
          # interpreter mpv links statically, and an import library carrying
          # luaL_* would collide with a consumer's own Lua for no reason.
          python3 scripts/make-import-def.py --prefix mpv_ \
            "staging-libmpv/$(basename "$dll")" staging-libmpv/mpv.def
          cp packaging/libmpv-README.md staging-libmpv/README.md
        shell: bash

      - name: Verify staged libmpv imports resolve
        run: python3 scripts/check-bundle-imports.py staging-libmpv

      - name: Package libmpv zip
        run: |
          ls -la staging-libmpv/
          cd staging-libmpv
          zip -r "../libmpv-omniphony-${VERSION//\//-}-windows-x86_64.zip" .

      - uses: actions/upload-artifact@v6
        with:
          name: libmpv-omniphony-windows-x86_64
          path: libmpv-omniphony-*-windows-x86_64.zip

  # macOS (Apple Silicon): mpv builds natively, so liborender is built in the
  # same job (like the Linux job, unlike the Windows cross-compile split).
  build-macos:
    if: ${{ !inputs.windows_only }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install mpv build deps (Homebrew)
        run: |
          brew update
          # molten-vk + vulkan-loader provide the Vulkan-on-Metal runtime that
          # libplacebo's gpu-next path needs on Apple Silicon (there is no native
          # Vulkan driver on macOS). They are bundled into the artifact below so
          # the build renders on a clean Mac without a system-wide Vulkan install.
          # libbluray/libdvdnav add BD/DVD/ISO playback (also bundled below).
          brew install meson ninja pkg-config ffmpeg libass libplacebo luajit \
            molten-vk vulkan-loader vulkan-headers \
            libbluray libdvdnav libdvdread

      - name: Checkout Omniphony (renderer source)
        uses: actions/checkout@v5
        with:
          repository: mgth/Omniphony
          ref: ${{ env.OMNIPHONY_REF }}
          path: omniphony

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build liborender from source
        # orender_ffi only pulls orender_engine (audio-free) — same minimal
        # build as the Linux/Windows liborender jobs.
        run: cargo build --release -p orender_ffi
        working-directory: omniphony/omniphony-renderer
        env:
          # This builds a *pinned external* source tree (Omniphony at
          # OMNIPHONY_REF), so lint policy there is not ours to enforce: an
          # immutable tag must stay buildable as rustc grows new lints.
          # dead_code in particular fires on liborender's dormant
          # artifact-evaluator path, which is reachable only through code the
          # FFI build never links.
          RUSTFLAGS: -D warnings -A dead_code

      - name: Stage liborender (bundled fallback)
        # Runtime dependency only: mpv dlopens it, preferring a Studio-deployed
        # engine and falling back to the copy dropped into Contents/MacOS below.
        run: |
          mkdir -p sysroot/usr/lib
          cp omniphony/omniphony-renderer/target/release/liborender.dylib \
             sysroot/usr/lib/liborender.dylib

      - name: Apply patches onto mpv
        run: bash scripts/apply-patches.sh "$MPV_TAG"

      - name: Build mpv with ad_orender
        run: |
          # Homebrew's pkgconfig (incl. vulkan-loader) so meson finds the brew
          # ffmpeg/libass/libplacebo/luajit and the Vulkan loader; liborender is
          # a pure runtime dependency and needs nothing here. cocoa/swift/vulkan
          # are auto-on; force them so the GUI + Vulkan(MoltenVK) display stack
          # is built and a silent disable becomes a loud failure (no-video
          # bundles are the whole bug).
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix vulkan-loader)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cd "build/mpv-${MPV_TAG}"
          # Disc playback (BD/DVD/ISO) via brew libbluray (pulls libudfread → raw
          # BD-ISO) + libdvdnav. mpv's own macos-bundle target relocates these and
          # every other dylib in the next step.
          meson setup _b -Dorender=enabled -Dlibbluray=enabled -Ddvdnav=enabled \
            -Dcocoa=enabled -Dswift-build=enabled -Dvulkan=enabled
          meson compile -C _b

      - name: Bundle into mpv.app (mpv's native macos-bundle)
        run: |
          # Use mpv's upstream TOOLS/osxbundle.py + dylib_unhell.py instead of a
          # hand-rolled bundler: it relocates every non-system dylib (incl.
          # liborender + the whole brew ffmpeg/libass/libplacebo stack) into
          # Contents/MacOS/lib, and its process_vulkan_loader() copies libMoltenVK
          # into Contents/Frameworks and writes a CORRECT ICD into
          # Contents/Resources/vulkan/icd.d (library_path relative to Frameworks).
          # This is what makes the app genuinely self-contained — mpv loads its
          # OWN bundled ffmpeg, fixing the "libavcodec build vs runtime" mismatch
          # (#22). Same PKG_CONFIG_PATH as the build so dylib_unhell's optional
          # `pkg-config vulkan` probe resolves.
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix vulkan-loader)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cd "build/mpv-${MPV_TAG}"
          meson compile -C _b macos-bundle   # -> _b/mpv.app (category 'video')

      - name: Brand, verify and package the .app
        run: |
          cd "build/mpv-${MPV_TAG}/_b"
          mv mpv.app mpv-omniphony.app
          # osxbundle's Info.plist template hardcodes io.mpv/mpv; rebrand, then
          # re-sign (editing the plist invalidates the ad-hoc signature). The
          # inner executable stays `mpv`; only the bundle dir is renamed.
          PB=/usr/libexec/PlistBuddy
          "$PB" -c "Set :CFBundleIdentifier fr.mgth.mpv-omniphony" mpv-omniphony.app/Contents/Info.plist
          "$PB" -c "Set :CFBundleName mpv-omniphony"               mpv-omniphony.app/Contents/Info.plist
          "$PB" -c "Add :CFBundleDisplayName string mpv-omniphony" mpv-omniphony.app/Contents/Info.plist 2>/dev/null || true

          # mpv no longer links liborender, so the bundler does not relocate it;
          # drop the fallback copy next to the binary ourselves (the runtime
          # loader's exe-dir candidate is Contents/MacOS). Before the codesign:
          # adding files after signing would invalidate the signature.
          cp "$GITHUB_WORKSPACE/sysroot/usr/lib/liborender.dylib" \
             mpv-omniphony.app/Contents/MacOS/liborender.dylib

          codesign --force --deep --sign - mpv-omniphony.app

          # Smoke test — all the headless runner can do: binary loads, Vulkan is
          # listed, MoltenVK + ICD are bundled, and no residual absolute brew path
          # remains (the old leak gate, kept).
          ./mpv-omniphony.app/Contents/MacOS/mpv --version
          ./mpv-omniphony.app/Contents/MacOS/mpv --gpu-api=help | grep -qi vulkan \
            || echo "!! warning: vulkan gpu-api not listed (MoltenVK detection?)" >&2
          test -f mpv-omniphony.app/Contents/Frameworks/libMoltenVK.dylib \
            || { echo "!! libMoltenVK.dylib not bundled" >&2; exit 1; }
          test -f mpv-omniphony.app/Contents/Resources/vulkan/icd.d/MoltenVK_icd.json \
            || { echo "!! MoltenVK ICD not bundled" >&2; exit 1; }
          # The bundled libMoltenVK keeps its brew install *id* (otool line 2);
          # that's by design — it's dlopen'd via the ICD's relative library_path,
          # never linked — so exclude that one self-reference. Any OTHER absolute
          # brew/local path would be a real un-relocated dependency.
          leak=$(find mpv-omniphony.app -type f \( -name '*.dylib' -o -name mpv \) -print0 \
                 | xargs -0 -I{} sh -c 'otool -L "{}" | awk "NR>1{print \$1}"' \
                 | grep -E '^/(opt/homebrew|usr/local)' \
                 | grep -v '/libMoltenVK\.dylib$' | sort -u || true)
          [ -z "$leak" ] || { echo "!! un-bundled absolute references remain:" >&2; echo "$leak" >&2; exit 1; }
          codesign --verify --deep --strict mpv-omniphony.app || true

          # Single artifact: the .app. CLI users run mpv-omniphony.app/Contents/MacOS/mpv
          # (the binary needs Contents/Frameworks + Resources for MoltenVK/ICD).
          zip -ry "${GITHUB_WORKSPACE}/mpv-omniphony-${VERSION//\//-}-macos-arm64.zip" mpv-omniphony.app

      - uses: actions/upload-artifact@v6
        with:
          name: mpv-omniphony-macos-arm64
          path: mpv-omniphony-*-macos-arm64.zip

  release:
    # Tag pushes only. A manual run is a build (smoke test, or an asset for an
    # already-published release): it uploads artifacts and stops there, rather
    # than drafting a release named after a branch.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mpv-omniphony-linux-x86_64

      - uses: actions/download-artifact@v7
        with:
          name: mpv-omniphony-windows-x86_64

      - uses: actions/download-artifact@v7
        with:
          name: libmpv-omniphony-windows-x86_64

      - uses: actions/download-artifact@v7
        with:
          name: mpv-omniphony-macos-arm64

      # Resolve the engine commit this build embeds, so the relocated release is
      # tagged at the exact liborender source it was compiled against (GPL §6).
      - name: Resolve engine commit for the release tag
        id: engineref
        env:
          GH_TOKEN: ${{ secrets.OMNIPHONY_RELEASE_TOKEN }}
        run: echo "sha=$(gh api repos/mgth/Omniphony/commits/${OMNIPHONY_REF} --jq .sha)" >> "$GITHUB_OUTPUT"

      # Publish the player bundles on the ENGINE repo's Releases page (the canonical
      # download hub) rather than here. Builds still run on mpv-omniphony; only the
      # publish target moves. The `mpv-v*` tag namespace avoids the engine repo's own
      # `v*` (Studio) and `liborender-v*` release triggers. Requires the
      # OMNIPHONY_RELEASE_TOKEN secret (contents:write on mgth/Omniphony).
      - name: Publish release on the engine repo (download hub)
        uses: softprops/action-gh-release@v3
        with:
          repository: mgth/Omniphony
          token: ${{ secrets.OMNIPHONY_RELEASE_TOKEN }}
          tag_name: mpv-${{ github.ref_name }}
          target_commitish: ${{ steps.engineref.outputs.sha }}
          draft: true
          name: mpv-omniphony ${{ github.ref_name }}
          body: |
            mpv-omniphony ${{ github.ref_name }} — mpv with the ad_orender
            spatial audio decoder.

            **What's in each archive:** `mpv` (or `mpv.exe`), a fallback engine
            library (`liborender.so.*` / `orender.dll`), `orender.h`, plus the
            bundled MinGW runtime DLLs on Windows. The live overlay is built
            into mpv itself — no script to install.

            **Engine loading:** mpv no longer links the engine — it loads
            liborender at runtime with an ABI version check, searching:
            `--ad-orender-library` / `$ORENDER_LIBRARY` → the engine deployed
            by Omniphony Studio (per-user data dir) → the copy bundled next to
            mpv → the system library path. Updating Omniphony Studio therefore
            updates the engine mpv uses, with no new mpv build; an
            incompatible library is rejected with a clear log line and mpv
            falls back to its native decoders.

            **macOS (Apple Silicon):** `…-macos-arm64.zip` contains a
            self-contained, double-clickable `mpv-omniphony.app` (built with
            mpv's own bundler — every dylib incl. ffmpeg and MoltenVK is bundled,
            no Homebrew required). CLI users run
            `mpv-omniphony.app/Contents/MacOS/mpv`. It is ad-hoc signed, not
            notarized, so the first launch is blocked by Gatekeeper — clear the
            download quarantine once with
            `xattr -dr com.apple.quarantine /path/to/mpv-omniphony.app`, or
            right-click → Open the first time.

            **Embedding (Windows):** `libmpv-omniphony-…-windows-x86_64.zip`
            carries `libmpv-2.dll` from this same build, with `libmpv.dll.a`
            (MinGW), `mpv.def` (run `lib /def:mpv.def /name:libmpv-2.dll
            /out:mpv.lib /MACHINE:X64` for MSVC), the `mpv/` headers and the
            runtime DLLs. Spatial decoding works there too, but the engine is
            searched next to the **host executable**, not next to
            `libmpv-2.dll` — set `$ORENDER_LIBRARY` or the
            `ad-orender-library` option if you put `orender.dll` elsewhere.

            **Upgrading?** The overlay is now built in: delete any
            `omniphony-overlay.lua` you previously copied into your mpv
            `scripts/` directory. A leftover copy is harmless (it self-disables
            on these PUC-Lua builds), but it is no longer needed.

            **NOT bundled:** the decoder bridge plugin
            (`omniphony_bridge.so` / `.dll`). Licensing constraints on the
            underlying codec mean users must obtain it themselves from
            [harletty-bridge](https://github.com/harletty/harletty-bridge/releases),
            and point mpv at it with
            `--ad-orender-bridge-path=/path/to/bridge.{so,dll,dylib}`.

            liborender built from source at Omniphony ${{ env.OMNIPHONY_REF }}.

            **License — GPL-3.0-or-later.** This build combines mpv
            (GPL-2.0-or-later) with liborender (GPL-3.0-or-later), so the
            combined work is GPLv3. Corresponding source: mpv
            `${{ env.MPV_TAG }}` + this repo's `patches/` at commit
            ${{ github.sha }}, and liborender at Omniphony
            `${{ env.OMNIPHONY_REF }}` (https://github.com/mgth/Omniphony).
            Bundled third-party libraries: see `THIRD-PARTY-NOTICES.md`.
          files: |
            mpv-omniphony-*-linux-x86_64.zip
            mpv-omniphony-*-windows-x86_64.zip
            libmpv-omniphony-*-windows-x86_64.zip
            mpv-omniphony-*-macos-arm64.zip
